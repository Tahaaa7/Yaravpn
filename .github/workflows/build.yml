# YARA VPN — extract ZIP + build APK (robust SDK install)
name: Build from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct ZIP URL (empty = file in repo)"
        required: false
        default: ""
        type: string
      zip_path:
        description: "ZIP path in repo"
        required: false
        default: "yara-vpn-for-github.zip"
        type: string
      build_type:
        description: "Build type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    branches: [main, master]
    paths:
      - "yara-vpn-for-github.zip"
      - "*.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

concurrency:
  group: yara-zip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract ZIP + Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/work"
          echo "WORK=$GITHUB_WORKSPACE/work" >> "$GITHUB_ENV"

      - name: Get ZIP file
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          ZIP_PATH: ${{ inputs.zip_path || 'yara-vpn-for-github.zip' }}
        run: |
          set -e
          DEST="$RUNNER_TEMP/source.zip"
          if [ -n "${ZIP_URL:-}" ]; then
            curl -fsSL "$ZIP_URL" -o "$DEST"
          elif [ -f "$GITHUB_WORKSPACE/$ZIP_PATH" ]; then
            cp "$GITHUB_WORKSPACE/$ZIP_PATH" "$DEST"
          else
            FOUND=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' | head -1 || true)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" "$DEST"
            else
              echo "::error::No ZIP found in repo root"
              ls -la "$GITHUB_WORKSPACE"
              exit 1
            fi
          fi
          ls -lh "$DEST"
          echo "ZIP_FILE=$DEST" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          set -e
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$ZIP_FILE" -d "$WORK"
          ENTRIES=$(find "$WORK" -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$ENTRIES" -eq 1 ]; then
            ONLY=$(find "$WORK" -mindepth 1 -maxdepth 1)
            if [ -d "$ONLY" ]; then
              shopt -s dotglob
              mv "$ONLY"/* "$WORK"/ 2>/dev/null || true
              rmdir "$ONLY" 2>/dev/null || true
            fi
          fi
          find "$WORK" -maxdepth 3 -type d | head -40

      - name: Detect Android project path
        id: layout
        run: |
          set -e
          if [ -d "$WORK/android/v2rayNG/V2rayNG" ]; then
            echo "root=$WORK/android/v2rayNG" >> "$GITHUB_OUTPUT"
            echo "app=$WORK/android/v2rayNG/V2rayNG" >> "$GITHUB_OUTPUT"
          elif [ -d "$WORK/V2rayNG" ]; then
            echo "root=$WORK" >> "$GITHUB_OUTPUT"
            echo "app=$WORK/V2rayNG" >> "$GITHUB_OUTPUT"
          elif [ -d "$WORK/v2rayNG/V2rayNG" ]; then
            echo "root=$WORK/v2rayNG" >> "$GITHUB_OUTPUT"
            echo "app=$WORK/v2rayNG/V2rayNG" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Android project not found in ZIP"
            find "$WORK" -maxdepth 4 -type d | head -60
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install platforms + NDK + build-tools
        run: |
          set +e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager=$SM"
          chmod +x "$SM" 2>/dev/null

          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646161dcb09b87b85c6ae\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes 2>/dev/null | "$SM" --licenses >/tmp/sdk-licenses.txt 2>&1 || true

          for pkg in \
            "platforms;android-37.0" \
            "platforms;android-37.2" \
            "platforms;android-36.1" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          do
            echo "=== Installing $pkg ==="
            yes 2>/dev/null | "$SM" "$pkg" >/tmp/sdk-install.txt 2>&1
            RC=$?
            tail -5 /tmp/sdk-install.txt || true
            echo "exit=$RC"
          done

          echo "=== platforms dir ==="
          ls -la "$ANDROID_HOME/platforms" || true

          SDK=35
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] || [ -d "$ANDROID_HOME/platforms/android-37" ] || [ -d "$ANDROID_HOME/platforms/android-37.2" ]; then
            SDK=37
            if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
              for c in android-37.0 android-37.2 android-37.1; do
                if [ -d "$ANDROID_HOME/platforms/$c" ]; then
                  ln -sfn "$c" "$ANDROID_HOME/platforms/android-37"
                  break
                fi
              done
            fi
          elif [ -d "$ANDROID_HOME/platforms/android-36.1" ] || [ -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDK=36
            if [ ! -e "$ANDROID_HOME/platforms/android-36" ] && [ -d "$ANDROID_HOME/platforms/android-36.1" ]; then
              ln -sfn android-36.1 "$ANDROID_HOME/platforms/android-36"
            fi
          fi
          echo "COMPILE_SDK=$SDK" >> "$GITHUB_ENV"
          echo "Selected COMPILE_SDK=$SDK"

          if [ -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
            echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          else
            NDK_DIR=$(ls -d "$ANDROID_HOME/ndk"/* 2>/dev/null | tail -1 || true)
            if [ -n "$NDK_DIR" ]; then
              echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
            else
              echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
            fi
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            \~/.gradle/caches
            \~/.gradle/wrapper
          key: gradle-zip-\( {{ runner.os }}- \){{ hashFiles('**/libs.versions.toml') }}
          restore-keys: gradle-zip-${{ runner.os }}-

      - name: Fetch hev-socks5-tunnel
        working-directory: ${{ steps.layout.outputs.root }}
        run: |
          rm -rf hev-socks5-tunnel
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel
          git -C hev-socks5-tunnel submodule update --init --recursive || true
          ls hev-socks5-tunnel/third-part/ || true

      - name: Build native hev-tun
        working-directory: ${{ steps.layout.outputs.root }}
        run: |
          if [ -f compile-hevtun.sh ]; then
            chmod +x compile-hevtun.sh
            bash compile-hevtun.sh
          else
            echo "::warning::compile-hevtun.sh missing"
          fi
          mkdir -p "${{ steps.layout.outputs.app }}/app/libs"
          if [ -d libs ]; then
            cp -a libs/. "${{ steps.layout.outputs.app }}/app/libs/" || true
          fi

      - name: Download libv2ray.aar
        run: |
          APP="${{ steps.layout.outputs.app }}"
          mkdir -p "$APP/app/libs"
          URL=$(curl -fsSL https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(next((a['browser_download_url'] for a in r.get('assets',[]) if a['name']=='libv2ray.aar'),''))")
          if [ -z "$URL" ]; then
            URL=$(curl -fsSL https://api.github.com/repos/2dust/AndroidLibXrayLite/releases \
              | python3 -c "import sys,json; rs=json.load(sys.stdin); print(next((a['browser_download_url'] for r in rs for a in r.get('assets',[]) if a['name']=='libv2ray.aar'),''))")
          fi
          test -n "$URL"
          curl -fsSL "$URL" -o "$APP/app/libs/libv2ray.aar"
          ls -lh "$APP/app/libs/libv2ray.aar"

      - name: Configure Gradle project
        working-directory: ${{ steps.layout.outputs.app }}
        run: |
          set -e
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${NDK_HOME}" >> local.properties

          SDK="${COMPILE_SDK:-36}"
          echo "Patching compileSdk/targetSdk -> $SDK"
          sed -i -E "s/compileSdk\s*=\s*[0-9]+/compileSdk = ${SDK}/" app/build.gradle.kts
          sed -i -E "s/targetSdk\s*=\s*[0-9]+/targetSdk = ${SDK}/" app/build.gradle.kts
          grep -n "compileSdk\|targetSdk" app/build.gradle.kts | head -10

          if ! grep -q "CheckAarMetadata" app/build.gradle.kts; then
            cat >> app/build.gradle.kts << 'EOF'

// CI: allow building when installed platform < dependency minCompileSdk
tasks.configureEach {
    if (name.contains("AarMetadata", ignoreCase = true)) {
        enabled = false
    }
}
EOF
          fi

          if ! grep -q "suppressUnsupportedCompileSdk" gradle.properties 2>/dev/null; then
            echo "android.suppressUnsupportedCompileSdk=${SDK},37,36" >> gradle.properties
          fi

          chmod +x gradlew

      - name: Prepare keystore (optional)
        id: keystore
        env:
          KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/yara-release.jks"
            echo "filePath=$RUNNER_TEMP/yara-release.jks" >> "$GITHUB_OUTPUT"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble APK
        working-directory: ${{ steps.layout.outputs.app }}
        env:
          KS_PATH: ${{ steps.keystore.outputs.filePath }}
          HAS_KS: ${{ steps.keystore.outputs.has_keystore }}
          KS_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          TYPE="${{ inputs.build_type || 'release' }}"
          SIGN_ARGS=""
          if [ "\( {HAS_KS}" = "true" ] && [ -f " \){KS_PATH:-}" ] && [ -n "\( {KS_PASS:-}" ] && [ -n " \){KEY_ALIAS:-}" ]; then
            SIGN_ARGS="-Pandroid.injected.signing.store.file=\( {KS_PATH} -Pandroid.injected.signing.store.password= \){KS_PASS} -Pandroid.injected.signing.key.alias=\( {KEY_ALIAS} -Pandroid.injected.signing.key.password= \){KEY_PASS:-$KS_PASS}"
          fi
          if [ "$TYPE" = "debug" ]; then
            ./gradlew assemblePlaystoreDebug --stacktrace --no-daemon
          else
            # shellcheck disable=SC2086
            ./gradlew assemblePlaystoreRelease $SIGN_ARGS --stacktrace --no-daemon
          fi

      - name: List APKs
        if: always()
        run: find "${{ steps.layout.outputs.app }}/app/build/outputs" -name '*.apk' 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yara-vpn-apk
          path: ${{ steps.layout.outputs.app }}/app/build/outputs/apk/**/**/*.apk
          if-no-files-found: warn
          retention-days: 14
