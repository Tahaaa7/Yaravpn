# YARA VPN — فقط ZIP را در ریپو بگذار؛ این workflow خودش extract و بیلد می‌کند
#
# روش استفاده:
#   1) یک ریپوی خالی بساز
#   2) فایل yara-vpn-for-github.zip را در ریشه ریپو آپلود/پوش کن
#   3) همین workflow را هم در .github/workflows/ بگذار
#   4) Actions → Build from ZIP → Run workflow
#   5) Artifacts → yara-vpn-apk

name: Build from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "لینک مستقیم ZIP (خالی = از فایل داخل ریپو استفاده می‌شود)"
        required: false
        default: ""
        type: string
      zip_path:
        description: "مسیر ZIP داخل ریپو"
        required: false
        default: "yara-vpn-for-github.zip"
        type: string
      build_type:
        description: "نوع بیلد"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    branches: [main, master]
    paths:
      - "yara-vpn-for-github.zip"
      - "*.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

concurrency:
  group: yara-zip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract ZIP + Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/work"
          echo "WORK=$GITHUB_WORKSPACE/work" >> "$GITHUB_ENV"

      - name: Get ZIP file
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          ZIP_PATH: ${{ inputs.zip_path || 'yara-vpn-for-github.zip' }}
        run: |
          set -e
          DEST="$RUNNER_TEMP/source.zip"

          if [ -n "${ZIP_URL:-}" ]; then
            echo "Downloading ZIP from URL..."
            curl -fsSL "$ZIP_URL" -o "$DEST"
          elif [ -f "$GITHUB_WORKSPACE/$ZIP_PATH" ]; then
            echo "Using ZIP from repo: $ZIP_PATH"
            cp "$GITHUB_WORKSPACE/$ZIP_PATH" "$DEST"
          else
            FOUND=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' | head -1 || true)
            if [ -n "$FOUND" ]; then
              echo "Using found ZIP: $FOUND"
              cp "$FOUND" "$DEST"
            else
              echo "::error::هیچ فایل ZIP پیدا نشد. یا yara-vpn-for-github.zip را در ریشه ریپو بگذار یا zip_url را در Run workflow پر کن."
              ls -la "$GITHUB_WORKSPACE"
              exit 1
            fi
          fi

          ls -lh "$DEST"
          echo "ZIP_FILE=$DEST" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          set -e
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$ZIP_FILE" -d "$WORK"

          ENTRIES=$(find "$WORK" -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$ENTRIES" -eq 1 ]; then
            ONLY=$(find "$WORK" -mindepth 1 -maxdepth 1)
            if [ -d "$ONLY" ]; then
              echo "Single root folder detected: $ONLY"
              shopt -s dotglob
              mv "$ONLY"/* "$WORK"/ 2>/dev/null || true
              rmdir "$ONLY" 2>/dev/null || true
            fi
          fi

          echo "=== Extracted layout ==="
          find "$WORK" -maxdepth 3 -type d | head -40

      - name: Detect Android project path
        id: layout
        run: |
          set -e
          if [ -d "$WORK/android/v2rayNG/V2rayNG" ]; then
            echo "root=$WORK/android/v2rayNG" >> "$GITHUB_OUTPUT"
            echo "app=$WORK/android/v2rayNG/V2rayNG" >> "$GITHUB_OUTPUT"
            echo "Layout: full project (android/v2rayNG)"
          elif [ -d "$WORK/V2rayNG" ]; then
            echo "root=$WORK" >> "$GITHUB_OUTPUT"
            echo "app=$WORK/V2rayNG" >> "$GITHUB_OUTPUT"
            echo "Layout: android-only root"
          elif [ -d "$WORK/v2rayNG/V2rayNG" ]; then
            echo "root=$WORK/v2rayNG" >> "$GITHUB_OUTPUT"
            echo "app=$WORK/v2rayNG/V2rayNG" >> "$GITHUB_OUTPUT"
            echo "Layout: v2rayNG folder"
          else
            echo "::error::ساختار پروژه اندروید داخل ZIP پیدا نشد"
            find "$WORK" -maxdepth 4 -type d | head -60
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          # Package id is "android-37.0" (not "android-37")
          packages: "platforms;android-37.0 build-tools;35.0.0 platform-tools ndk;27.0.12077973"
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "12266719"

      - name: Export SDK / NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "Available platforms:"
          ls "${ANDROID_HOME}/platforms" || true
          if [ -d "\( {ANDROID_HOME}/platforms/android-37.0" ] && [ ! -e " \){ANDROID_HOME}/platforms/android-37" ]; then
            ln -s android-37.0 "${ANDROID_HOME}/platforms/android-37" || true
          fi
          if [ ! -d "\( {ANDROID_HOME}/platforms/android-37" ] && [ ! -d " \){ANDROID_HOME}/platforms/android-37.0" ]; then
            echo "Trying alternate package ids..."
            yes | sdkmanager --install "platforms;android-37.0" || true
            yes | sdkmanager --install "platforms;android-37" || true
          fi
          if [ ! -d "\( {ANDROID_HOME}/platforms/android-37" ] && [ ! -d " \){ANDROID_HOME}/platforms/android-37.0" ]; then
            echo "::error::Could not install Android platform 37"
            sdkmanager --list 2>/dev/null | grep -i "platforms;android-3" | head -20 || true
            exit 1
          fi
          if [ -d "${ANDROID_HOME}/ndk/27.0.12077973" ]; then
            echo "NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"
          else
            yes | sdkmanager --install "ndk;27.0.12077973" || true
            echo "NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            \~/.gradle/caches
            \~/.gradle/wrapper
          key: gradle-zip-\( {{ runner.os }}- \){{ hashFiles('**/libs.versions.toml') }}
          restore-keys: gradle-zip-${{ runner.os }}-

      - name: Fetch hev-socks5-tunnel
        working-directory: ${{ steps.layout.outputs.root }}
        run: |
          rm -rf hev-socks5-tunnel
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel
          git -C hev-socks5-tunnel submodule update --init --recursive || true
          ls hev-socks5-tunnel/third-part/ || true

      - name: Build native hev-tun
        working-directory: ${{ steps.layout.outputs.root }}
        run: |
          if [ -f compile-hevtun.sh ]; then
            chmod +x compile-hevtun.sh
            bash compile-hevtun.sh
          else
            echo "::warning::compile-hevtun.sh missing"
          fi
          mkdir -p "${{ steps.layout.outputs.app }}/app/libs"
          if [ -d libs ]; then
            cp -a libs/. "${{ steps.layout.outputs.app }}/app/libs/" || true
          fi

      - name: Download libv2ray.aar
        run: |
          APP="${{ steps.layout.outputs.app }}"
          mkdir -p "$APP/app/libs"
          URL=$(curl -fsSL https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(next((a['browser_download_url'] for a in r.get('assets',[]) if a['name']=='libv2ray.aar'),''))")
          if [ -z "$URL" ]; then
            URL=$(curl -fsSL https://api.github.com/repos/2dust/AndroidLibXrayLite/releases \
              | python3 -c "import sys,json; rs=json.load(sys.stdin); print(next((a['browser_download_url'] for r in rs for a in r.get('assets',[]) if a['name']=='libv2ray.aar'),''))")
          fi
          test -n "$URL"
          curl -fsSL "$URL" -o "$APP/app/libs/libv2ray.aar"
          ls -lh "$APP/app/libs/libv2ray.aar"

      - name: Configure Gradle project
        working-directory: ${{ steps.layout.outputs.app }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${NDK_HOME}" >> local.properties
          if [ -d "\( {ANDROID_HOME}/platforms/android-37.0" ] && [ ! -e " \){ANDROID_HOME}/platforms/android-37" ]; then
            ln -s android-37.0 "${ANDROID_HOME}/platforms/android-37" || true
          fi
          if [ ! -d "\( {ANDROID_HOME}/platforms/android-37" ] && [ ! -d " \){ANDROID_HOME}/platforms/android-37.0" ]; then
            echo "::error::Android platform 37 is required but could not be installed"
            ls -la "${ANDROID_HOME}/platforms" || true
            exit 1
          fi
          chmod +x gradlew

      - name: Prepare keystore (optional)
        id: keystore
        env:
          KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/yara-release.jks"
            echo "filePath=$RUNNER_TEMP/yara-release.jks" >> "$GITHUB_OUTPUT"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble APK
        working-directory: ${{ steps.layout.outputs.app }}
        env:
          KS_PATH: ${{ steps.keystore.outputs.filePath }}
          HAS_KS: ${{ steps.keystore.outputs.has_keystore }}
          KS_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          TYPE="${{ inputs.build_type || 'release' }}"
          SIGN_ARGS=""
          if [ "\( {HAS_KS}" = "true" ] && [ -f " \){KS_PATH:-}" ] && [ -n "\( {KS_PASS:-}" ] && [ -n " \){KEY_ALIAS:-}" ]; then
            SIGN_ARGS="-Pandroid.injected.signing.store.file=\( {KS_PATH} -Pandroid.injected.signing.store.password= \){KS_PASS} -Pandroid.injected.signing.key.alias=\( {KEY_ALIAS} -Pandroid.injected.signing.key.password= \){KEY_PASS:-$KS_PASS}"
          fi
          if [ "$TYPE" = "debug" ]; then
            ./gradlew assemblePlaystoreDebug --stacktrace --no-daemon
          else
            # shellcheck disable=SC2086
            ./gradlew assemblePlaystoreRelease $SIGN_ARGS --stacktrace --no-daemon
          fi

      - name: List APKs
        if: always()
        run: find "${{ steps.layout.outputs.app }}/app/build/outputs" -name '*.apk' 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yara-vpn-apk
          path: ${{ steps.layout.outputs.app }}/app/build/outputs/apk/**/**/*.apk
          if-no-files-found: warn
          retention-days: 14
